{% extends "base/base.html" %}

{% block title %}Payment Successful{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-75 py-5">
    <div class="card shadow text-center p-4" style="max-width: 500px; width: 100%;">
        <div class="card-body">
            <div class="mb-3">
                <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
            </div>
            <h1 class="h3 mb-3 text-success">Payment Successful!</h1>
            <p class="fw-bold lead mb-2">Order #{{ order.id }}</p>
            <p class="mb-4">Thank you for your purchase at PlayZoneX!</p>
            <a href="/orders/history/" class="btn btn-primary w-100">
                <i class="fas fa-box me-2"></i>View Your Orders
            </a>
        </div>
    </div>
</div>
{% endblock %}
