{% extends "base/base.html" %}

{% block title %}Payment Failed{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-75 py-5">
    <div class="card shadow text-center p-4" style="max-width: 500px; width: 100%;">
        <div class="card-body">
            <div class="mb-3">
                <i class="fas fa-times-circle text-danger" style="font-size: 4rem;"></i>
            </div>
            <h1 class="h3 mb-3 text-danger">Payment Failed</h1>
            <p class="text-muted mb-4">{{ error }}</p>
            <a href="{% url 'home_page' %}" class="btn btn-primary w-100">
                <i class="fas fa-home me-2"></i>Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
